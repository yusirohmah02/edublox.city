const NOPT=[0,3,5,8,10],selLv=(cur,fn)=>`<select onchange="${fn}=+this.value">${LV.map((x,i)=>`<option value="${i}" ${cur==i?'selected':''}>${i?x:'Semua level'}</option>`).join('')}</select>`,selN=(cur,fn)=>`<select onchange="${fn}=+this.value">${NOPT.map(n=>`<option value="${n}" ${cur==n?'selected':''}>${n?n+' soal':'Semua soal'}</option>`).join('')}</select>`;
function pickQ(qs,lv,n){let a=qs.map((q,ix)=>Object.assign({},q,{ix}));if(lv)a=a.filter(q=>(q.l||2)==lv);for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return n?a.slice(0,n):a}
function pickQs(bd){let a=pickQ(bd.q,QS.lv,QS.n);if(!a.length&&QS.lv){toast('Tidak ada soal level itu, memakai semua level');a=pickQ(bd.q,0,QS.n)}return a}
function showLv(){$('gc').innerHTML=`<h2>🎚 Level &amp; Jumlah Soal</h2>Level${selLv(QS.lv,'QS.lv')}Jumlah soal${selN(QS.n,'QS.n')}<p style="font-size:12px">Berlaku untuk Kuis Serentak (dipandu guru). Soal dipilih acak. Pada Mode Mandiri, siswa memilih level dan jumlah soal sendiri di HP. Level tiap soal diatur di Custom Guru (l: 1 mudah, 2 sedang, 3 sulit).</p><button class="btn g" onclick="$('mg').style.display='none';toast('Pengaturan disimpan')">Simpan</button>`;$('mg').style.display='flex'}
function home(end){mp=null;if(SC&&SC.m){sv(`<p>${end?'🏁 Selesai! ':''}⭐ Skor: ${mySc}</p><b>1. Pilih level dan jumlah soal</b>${selLv(SL.lv,'SL.lv')}${selN(SL.n,'SL.n')}<b>2. Pilih gedung</b>`+SC.b.map((b,i)=>`<button class="btn big" style="background:${hx(b.c)}" onclick="mpStart(${i})">${hx(b.i)} Gedung ${hx(b.k)}: ${hx(b.n)} (${b.q.length} soal)</button>`).join(''))}else sv(end?`🏁 Selesai! Skor kamu: ⭐ ${mySc}`:'Menunggu soal dari guru…')}
function mpStart(i){const qs=pickQ(SC.b[i].q,SL.lv,SL.n);if(!qs.length){alert('Tidak ada soal level itu di gedung ini. Ganti level.');return}mp={b:i,i:0,a:-1,qs};mpq()}
function mpq(){const b=SC.b[mp.b],q=mp.qs[mp.i];if(!q){home(1);return}const done=mp.a>=0;sv(`<small>Gedung ${hx(b.k)} · ${hx(b.n)} · ${LV[q.l||2]} · Soal ${mp.i+1}/${mp.qs.length} · ⭐ ${mySc}</small><p style="font-weight:800;font-size:18px">${hx(q.t)}</p>`+q.o.map((o,i)=>`<button class="btn big ${done?(i==q.a?'g':mp.a==i?'r':''):''}" ${done?'disabled':''} onclick="mpPick(${i})">${'ABCD'[i]}. ${hx(o)}</button>`).join('')+(done?`<p>${mp.a==q.a?'✅ Benar! +10':'❌ Belum tepat. Kunci: '+'ABCD'[q.a]}</p><p>💡 ${hx(q.e||'')}</p><button class="btn b big" onclick="mpNext()">${mp.i+1<mp.qs.length?'Soal berikutnya ➡':'Selesai 🏁'}</button>`:'')+`<button class="btn r" onclick="home()">⬅ Ganti gedung</button>`)}
function mpPick(k){if(!mp||mp.a>=0)return;const b=SC.b[mp.b],q=mp.qs[mp.i];mp.a=k;const key=b.k+'-'+q.ix;if(!MD[key]){MD[key]=1;if(k==q.a)mySc+=10}SR.emit('ans',{m:1,b:b.k,i:q.ix,k,n:++mn}).catch(()=>{});mpq()}
function mpNext(){mp.i++;mp.a=-1;mpq()}
// level default + soal tambahan (sulit)
B.forEach(b=>{b.q[0].l=1;b.q[1].l=2});
[[0,'Pernyataan yang menggambarkan saling ketergantungan dalam ekosistem kolam adalah...',['Ikan hidup tanpa tumbuhan air','Tumbuhan air menghasilkan oksigen untuk ikan, ikan menghasilkan karbon dioksida untuk tumbuhan','Air kolam tidak memengaruhi makhluk hidup','Ikan hanya bergantung pada batu'],1,'Oksigen dan karbon dioksida saling dipertukarkan.'],
[1,'Jamur dan bakteri pengurai penting karena...',['Mengubah sisa makhluk hidup menjadi zat hara bagi tanah','Membuat makanan lewat fotosintesis','Memangsa hewan besar','Menghasilkan cahaya'],0,'Pengurai mengembalikan zat hara ke tanah.'],
[2,'Kaktus berduri di gurun beradaptasi terhadap faktor abiotik berupa...',['Air melimpah','Curah hujan sangat sedikit','Suhu selalu dingin','Tanah berlumpur'],1,'Kaktus menyimpan air karena hujan sedikit.'],
[3,'Rantai padi → tikus → ular → elang. Jika ular berkurang drastis, yang paling mungkin terjadi adalah...',['Populasi tikus meningkat dan padi berkurang','Elang bertambah banyak','Padi bertambah banyak','Tikus punah'],0,'Tanpa predator, tikus bertambah dan memakan padi.'],
[4,'Tindakan paling tepat menjaga keseimbangan ekosistem sungai adalah...',['Membuang limbah ke sungai','Menangkap ikan dengan racun','Tidak membuang sampah dan menjaga tepi sungai tetap hijau','Menimbun sungai dengan tanah'],2,'Sungai yang bersih menjaga makhluk hidup di dalamnya.']].forEach(x=>B[x[0]].q.push(Object.assign(Q(x[1],x[2],x[3],x[4]),{l:3})));

loop();
